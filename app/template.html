<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Coleção Hot Wheels — BMW · Porsche · Ferrari</title>
<meta name="theme-color" content="#eb6834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coleção Pessoal">
<meta name="application-name" content="Coleção Pessoal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- favicon embutido: funciona mesmo quando só o index.html é baixado -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141419'/%3E%3Cpath d='M38 18C28 14 18 18 8 15c6 6 4 9 2 12 8-1 10 3 8 7 8-3 12 0 14 4 6 4 14 4 18 0Z' fill='%23ff8a00'/%3E%3Ccircle cx='42' cy='28' r='13' fill='%230a0a0c'/%3E%3Ccircle cx='42' cy='28' r='9' fill='none' stroke='%23e2211c' stroke-width='3'/%3E%3Ccircle cx='42' cy='28' r='5.5' fill='%23c8c8ce'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light dark;
  --bg:#f5f4f0; --surf:#ffffff; --surf2:#efede8; --ink:#191712; --ink2:#57534a; --mut:#8b867c;
  --line:#e5e2da; --border:rgba(25,23,18,.08);
  --brand:#d92018; --brand2:#ff8a00; --brand3:#ffd400;
  --acc:#d92018; --acc-soft:#ffe3d6; --link:#1f6fd0;
  --good:#149447; --good-soft:#d9f2e2; --good-txt:#0d7a39;
  --warn:#f0a51a; --warn-soft:#fdeecb;
  --crit:#d03b3b; --rara:#ec835a; --p3:#c98500;
  --meter-fill:#149447; --meter-mid:#f0a51a; --meter-track:#e5e2da;
  --radius:16px;
  --shadow:0 1px 2px rgba(25,23,18,.05),0 6px 18px rgba(25,23,18,.06);
  --shadow-up:0 2px 4px rgba(25,23,18,.07),0 10px 28px rgba(25,23,18,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111013; --surf:#1b1a1e; --surf2:#26242a; --ink:#f4f2ee; --ink2:#bab5ab; --mut:#8b867c;
    --line:#2e2c33; --border:rgba(255,255,255,.08);
    --acc-soft:#4a1e12; --link:#5ea0ec;
    --good-soft:#123322; --good-txt:#3ecf7a;
    --warn-soft:#38290a;
    --meter-track:#2e2c33;
    --shadow:none; --shadow-up:0 10px 28px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(44px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:active{transform:scale(.985)}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--link)}
img{max-width:100%}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:6px}

/* ---------- Cabeçalho ---------- */
header{position:sticky;top:0;z-index:30;background:var(--surf);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.stripe{height:4px;background:linear-gradient(90deg,var(--brand) 0 45%,var(--brand2) 45% 75%,var(--brand3) 75% 100%)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;max-width:1200px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.logo>div{min-width:0}
.logo .mark{width:38px;height:38px;flex:none;border-radius:11px;box-shadow:var(--shadow)}
.logo h1{font-size:16.5px;font-weight:800;letter-spacing:-.2px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;color:var(--mut);font-weight:500;font-size:11px;margin-top:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:1 1 110px;display:flex;min-width:0;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut);pointer-events:none}
.search input{flex:1;min-width:0;background:var(--surf2);border:1.5px solid transparent;border-radius:999px;padding:9px 14px 9px 32px;outline:none;transition:border-color .15s,background .15s}
.search input:focus{border-color:var(--brand2);background:var(--surf)}
.search input::placeholder{color:var(--mut)}
#btnHelp{width:36px;height:36px;flex:none;border-radius:50%;background:var(--surf2);font-weight:800;color:var(--ink2);transition:background .15s}
#btnHelp:hover{background:var(--acc-soft);color:var(--ink)}
@media(max-width:560px){
  .hd{flex-wrap:wrap;padding-bottom:10px}
  .logo{flex:1 1 auto}
  .search{order:3;flex:1 0 100%}
}
nav{max-width:1200px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:2px 12px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:7px 14px;color:var(--ink2);font-weight:650;font-size:13.5px;border-radius:999px;background:var(--surf2);transition:background .15s,color .15s}
nav button .n{font-weight:500;font-size:11.5px;margin-left:5px;opacity:.65}
nav button.on{color:#fff;background:linear-gradient(120deg,var(--brand),#ff5a1f)}
nav button.on .n{opacity:.85}
nav button:not(.on):hover{background:var(--line)}

/* ---------- Controles / filtros ---------- */
main{max-width:1200px;margin:0 auto;padding:14px}
.subtitle{color:var(--ink2);font-size:13px;margin:0 2px 12px}
.controls{margin-bottom:12px}
.controls-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;background:var(--surf);border:1.5px solid var(--line);font-size:13px;font-weight:650;color:var(--ink2);transition:all .15s}
.chip:hover{border-color:var(--mut)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--surf);border:1.5px solid var(--line);font-size:13px;font-weight:650;color:var(--ink2);transition:all .15s}
.fbtn:hover{border-color:var(--mut)}
.fbtn.on{border-color:var(--brand2);color:var(--ink)}
.fbtn .fb-n{background:var(--brand);color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.controls select{background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--ink2);max-width:180px;transition:border-color .15s}
.controls select.on{border-color:var(--brand2);color:var(--ink);font-weight:650}
#btnLimpar{font-size:13px;color:var(--brand);font-weight:700;padding:7px 6px}
.fpanel{display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;padding:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.fpanel.open{display:grid}
.fpanel select{max-width:none;width:100%}
.resumo{color:var(--mut);font-size:13px;margin:0 2px 10px}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:grid;grid-template-columns:88px 1fr;gap:12px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;position:relative;overflow:hidden}
.card:hover{box-shadow:var(--shadow-up);transform:translateY(-1px)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background .15s}
.card.tenho::before{background:var(--good)}
.card.caminho::before{background:var(--warn)}
.thumb{width:88px;height:88px;flex:none;border-radius:12px;background:var(--surf2);overflow:hidden;display:grid;place-items:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:none}
.thumb img.ok{display:block}
.thumb img.ok~svg{display:none}
.thumb svg{width:44px;height:44px;color:var(--mut);opacity:.7}
.thumb .src{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:1px 5px;border-radius:6px;display:none}
/* recorte da miniatura solta sobre a foto do blister */
.thumb .mini{position:absolute;right:2px;bottom:2px;width:34px;height:34px;border-radius:8px;object-fit:cover;border:2px solid var(--surf);background:var(--surf2);display:none}
.thumb .mini.ok{display:block}
.c-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.c-top{display:flex;gap:8px;align-items:baseline}
.c-top h3{margin:0;font-size:15px;font-weight:700;line-height:1.3;flex:1;min-width:0}
.ano{flex:none;font-size:12px;font-weight:700;color:var(--ink2);background:var(--surf2);border-radius:7px;padding:2px 8px}
.c-sub{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-cor{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-cor b{font-weight:600}
.toy{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--mut)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.bdg{font-size:11px;font-weight:600;color:var(--ink2);background:var(--surf2);border-radius:7px;padding:3px 8px;display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.bdg.excl{background:var(--acc-soft);color:var(--ink)}
.ownseg{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;background:var(--surf2);border-radius:12px;padding:4px}
.ownseg button{padding:9px 4px;border-radius:9px;font-size:12.5px;font-weight:650;color:var(--ink2);transition:background .15s,color .15s}
.ownseg button[aria-pressed="true"].o0{background:var(--surf);color:var(--ink);outline:1.5px solid var(--line)}
.ownseg button[aria-pressed="true"].o1{background:var(--warn);color:#3a2c00}
.ownseg button[aria-pressed="true"].o2{background:var(--good);color:#fff}
#sentinel{height:10px}
.vazio{color:var(--mut);text-align:center;padding:56px 12px;font-size:14px}
.vazio::before{content:'🔍';display:block;font-size:34px;margin-bottom:10px}
.vazio.load::before{content:'🚐'}
.vazio.erro::before{content:'📡'}

/* ---------- Painel ---------- */
.hero{position:relative;background:linear-gradient(125deg,#c81410 0%,#e2211c 38%,#ff8a00 100%);color:#fff;border:none;border-radius:20px;box-shadow:var(--shadow-up);padding:24px 20px;text-align:center;margin-bottom:14px;overflow:hidden}
.hero::after{content:'🏁';position:absolute;right:-6px;bottom:-14px;font-size:92px;opacity:.16;transform:rotate(-10deg)}
.hero .big{font-size:54px;font-weight:800;line-height:1.02;letter-spacing:-1px;text-shadow:0 2px 8px rgba(0,0,0,.18)}
.hero .sub{color:rgba(255,255,255,.92);margin-top:6px;font-size:14px}
.hero .sub b{color:#fff}
.hero .meter{background:rgba(0,0,0,.25);margin:14px auto 0;max-width:420px;height:12px;border-radius:6px}
.hero .meter .m1{background:#fff}
.hero .meter .m2{background:rgba(255,255,255,.55)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer;text-align:left;transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:var(--shadow-up);transform:translateY(-1px)}
.tile h3{margin:0 0 4px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.tile .val{font-size:28px;font-weight:800;letter-spacing:-.5px}
.tile .val small{font-size:14px;color:var(--mut);font-weight:500}
.meter{height:10px;border-radius:5px;background:var(--meter-track);margin:10px 0 8px;display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .m1{background:var(--meter-fill)}
.meter .m2{background:var(--meter-mid);margin-left:2px}
.meter .m1:first-child{border-radius:5px 0 0 5px}
.tile .leg{font-size:12px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap}
.leg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.tile .p1chip{margin-top:9px;font-size:12px;font-weight:700;color:var(--crit)}
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.atalho{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:13px 14px;text-align:left;font-weight:650;font-size:13.5px;color:var(--ink);box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s}
.atalho:hover{box-shadow:var(--shadow-up);transform:translateY(-1px)}
.atalho small{display:block;color:var(--mut);font-weight:450;margin-top:2px}
.painel-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:650;font-size:13.5px;color:var(--ink2);transition:all .15s}
.btn:hover:not(:disabled){border-color:var(--mut);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:linear-gradient(120deg,var(--brand),#ff5a1f);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.nota-rodape{color:var(--mut);font-size:12px;margin-top:16px;line-height:1.6}

/* ---------- Castings ---------- */
.cast-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;text-align:left;transition:box-shadow .15s,transform .15s}
.cast-card:hover{box-shadow:var(--shadow-up);transform:translateY(-1px)}
.cast-card h3{margin:0 0 3px;font-size:15px;font-weight:700}
.cast-card .meta{font-size:12.5px;color:var(--ink2)}
.cast-card .meter{margin:9px 0 5px}
.cast-card .prog{font-size:12px;color:var(--mut)}

/* ---------- Modais ---------- */
.modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(12,10,8,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal.open{display:block}
.sheet{position:absolute;inset:auto 0 0 0;top:max(24px,env(safe-area-inset-top));background:var(--bg);border-radius:22px 22px 0 0;overflow-y:auto;overscroll-behavior:contain;animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:720px){.sheet{inset:40px 0;max-width:760px;margin:0 auto;border-radius:22px}}
.sheet-hd{position:sticky;top:0;background:var(--surf);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;gap:10px;align-items:center;z-index:5;border-radius:22px 22px 0 0}
.sheet-hd::before{content:'';position:absolute;left:50%;top:6px;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--line)}
.sheet-hd h2{margin:0;font-size:17px;font-weight:750;flex:1;min-width:0}
.sheet-hd .x{width:34px;height:34px;flex:none;border-radius:50%;background:var(--surf2);font-size:16px;font-weight:700;color:var(--ink2);transition:background .15s}
.sheet-hd .x:hover{background:var(--acc-soft);color:var(--ink)}
.sheet-bd{padding:16px 16px 34px}

/* fotos no detalhe */
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.slot{background:var(--surf);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.slot .img{aspect-ratio:1;background:var(--surf2);display:grid;place-items:center;cursor:zoom-in;position:relative}
.slot .img img{width:100%;height:100%;object-fit:cover;display:none}
.slot .img img.ok{display:block}
.slot .img img.ok~svg{display:none}
.slot .img svg{width:52px;height:52px;color:var(--mut);opacity:.7}
.slot .img .tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 7px;border-radius:6px;display:none}
.slot h4{margin:0;padding:9px 11px 2px;font-size:13px;font-weight:700}
.slot .acts{display:flex;gap:5px;padding:7px 9px 10px;flex-wrap:wrap}
.slot .acts button{flex:1;min-width:64px;background:var(--surf2);border-radius:9px;padding:8px 4px;font-size:12px;font-weight:650;color:var(--ink2);transition:background .15s,color .15s}
.slot .acts button:hover{background:var(--acc-soft);color:var(--ink)}
.det-own{margin-bottom:16px}
.det-own .ownseg{grid-column:auto}
.det-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
dl{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:7px 12px;margin:0 0 16px;font-size:13.5px;background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
dt{color:var(--mut)}
dd{margin:0;word-break:break-word}
dd a{word-break:break-all}
.nota-box textarea{width:100%;min-height:64px;background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:10px;resize:vertical;transition:border-color .15s}
.nota-box textarea:focus{border-color:var(--brand2);outline:none}
.det-nav{display:flex;gap:8px;justify-content:space-between;margin-top:18px}

/* zoom */
#mZoom{background:rgba(0,0,0,.93);display:none;place-items:center;cursor:zoom-out;backdrop-filter:none}
#mZoom.open{display:grid}
#mZoom img{max-width:100vw;max-height:100vh;object-fit:contain}

/* wiki picker */
.wk-status{color:var(--ink2);font-size:13.5px;margin:0 0 12px}
.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wk-item{background:var(--surf);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.wk-item.match{border-color:var(--good);border-width:2px}
.wk-item .wi{aspect-ratio:1;background:var(--surf2);cursor:zoom-in}
.wk-item .wi img{width:100%;height:100%;object-fit:cover}
.wk-item figcaption{font-size:11px;color:var(--ink2);padding:5px 7px;max-height:48px;overflow:hidden}
.wk-item .m-tag{font-size:10.5px;font-weight:750;color:var(--good-txt);padding:4px 7px 0}
.wk-item .acts{display:flex;gap:4px;padding:6px}
.wk-item .acts button{flex:1;background:var(--surf2);border-radius:8px;padding:7px 2px;font-size:11.5px;font-weight:650;color:var(--ink2);transition:background .15s}
.wk-item .acts button:hover{background:var(--acc-soft);color:var(--ink)}

/* ajuda */
.help-sec h3{font-size:14.5px;margin:18px 0 6px}
.help-sec p,.help-sec li{font-size:13.5px;color:var(--ink2)}
.help-tab{width:100%;border-collapse:collapse;font-size:12.5px}
.help-tab td{border-top:1px solid var(--line);padding:7px 8px 7px 0;vertical-align:top}
.help-tab td:first-child{color:var(--mut);white-space:nowrap;padding-right:12px}

/* ---------- Base Tooned ---------- */
.t-hero{background:linear-gradient(125deg,#5b1ea8 0%,#9b1fb5 45%,#ff5a1f 100%)}
.t-hero::after{content:'💥'}
.t-filtros{margin-bottom:12px}
.tvars{display:flex;flex-direction:column;gap:8px}
.tvars.solta{margin-top:4px}
.tvar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s,transform .15s}
.tvar:hover{box-shadow:var(--shadow-up);transform:translateY(-1px)}
.tvar.tem{border-color:var(--good)}
.tvar.pend{opacity:.75;cursor:default}
.tvar.pend:hover{transform:none;box-shadow:var(--shadow)}
.tv-own{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--surf2);font-weight:800;color:var(--good-txt);font-size:15px;transition:all .15s}
.tv-own.on{background:var(--good);border-color:var(--good);color:#fff}
.tv-own.vazio{color:var(--mut);cursor:default;font-weight:700}
.tv-main{min-width:0}
.tv-top{display:flex;gap:8px;align-items:baseline}
.tv-top b{font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-sub{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-go{color:var(--mut);font-size:19px;font-weight:700}
.t-sec{font-size:14px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}

<script>
'use strict';
const DATA = __HW_DATA_JSON__;

/* ============ Índices e utilidades ============ */
const CI = {}; DATA.cols.forEach((c,i)=>CI[c]=i);
const F = (it,c)=>it.v[CI[c]];
const esc = s => String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nrm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fmt = n => n.toLocaleString('pt-BR');
const $ = s => document.querySelector(s);

const MARCAS = {bmw:'BMW', porsche:'Porsche', ferrari:'Ferrari', outras:'Outras linhas', kool:'Kool Kombi', toonedw:'Tooned · da wiki'};
const ITEMS = [];
for(const m of DATA.marcas){
  m.itens.forEach((v,i)=>{
    const it = {id:m.prefixo+(i+1), mk:m.key, v, ord:ITEMS.length};
    it.hay = nrm(['casting','modelo','serie','nserie','ncol','toy','cor','tampo','rodas','excl','tipo','notas','pais','escopo','ano']
      .map(c=>F(it,c)??'').join(' ')+' '+MARCAS[m.key]);
    ITEMS.push(it);
  });
}
const BYID = Object.fromEntries(ITEMS.map(it=>[it.id,it]));
const porCasting = {};
for(const it of ITEMS){ const k=nrm(F(it,'casting')||''); (porCasting[k] ||= []).push(it); }

/* ============ Estado persistente ============ */
const LS_KEY='hwc.state.v1';
let ST = {it:{}, covers:{}};
try{ const raw=localStorage.getItem(LS_KEY); if(raw) ST=Object.assign(ST,JSON.parse(raw)); }catch(e){}
/* capas v3 guardam duas fotos por casting ({m: solta, b: cartela}) — descarta o cache antigo */
if(ST.coversV!==3){ ST.covers={}; ST.coversV=3; }
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(LS_KEY,JSON.stringify(ST)); }catch(e){ toast('Não consegui salvar (armazenamento cheio?)'); } },250); }
const stOf = id => ST.it[id] || {};
function setSt(id,patch){ const cur=ST.it[id]||{}; Object.assign(cur,patch);
  for(const k of Object.keys(cur)) if(cur[k]===0||cur[k]===''||cur[k]==null) delete cur[k];
  if(Object.keys(cur).length) ST.it[id]=cur; else delete ST.it[id]; save(); }
function own(id){ return stOf(id).o||0; } /* 0 falta · 1 a caminho · 2 tenho */

/* ============ IndexedDB (fotos) ============ */
let _db=null;
function db(){ return _db ? Promise.resolve(_db) : new Promise((res,rej)=>{
  const r=indexedDB.open('hwc-fotos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('fotos');
  r.onsuccess=()=>{_db=r.result;res(_db)}; r.onerror=()=>rej(r.error);
});}
const tx = (mode,fn) => db().then(d=>new Promise((res,rej)=>{
  const t=d.transaction('fotos',mode); const out=fn(t.objectStore('fotos'));
  t.oncomplete=()=>res(out&&'result'in out?out.result:undefined); t.onerror=()=>rej(t.error);
}));
const fPut=(k,b)=>tx('readwrite',s=>s.put(b,k));
const fDel=k=>tx('readwrite',s=>s.delete(k));
const fGet=k=>db().then(d=>new Promise((res,rej)=>{ const r=d.transaction('fotos').objectStore('fotos').get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }));
const fKeys=()=>db().then(d=>new Promise((res,rej)=>{ const r=d.transaction('fotos').objectStore('fotos').getAllKeys(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
const urlCache=new Map();
async function fotoUrl(k){ if(urlCache.has(k)) return urlCache.get(k);
  const b=await fGet(k).catch(()=>null); if(!b) return null;
  const u=URL.createObjectURL(b); urlCache.set(k,u); return u; }
function dropUrl(k){ const u=urlCache.get(k); if(u){URL.revokeObjectURL(u);urlCache.delete(k);} }

async function redimensionar(file,max,q){
  let bmp;
  try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){
    bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); });
  }
  const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
  const r=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement('canvas'); cv.width=Math.round(w*r); cv.height=Math.round(h*r);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',q));
}
async function salvarFoto(id,slot,file){
  toast('Salvando foto…');
  try{
    const full=await redimensionar(file,1400,.85);
    const th=await redimensionar(file,360,.8);
    await fPut(`${id}:${slot}`,full); await fPut(`${id}:${slot}:t`,th);
    dropUrl(`${id}:${slot}`); dropUrl(`${id}:${slot}:t`);
    setSt(id,{ [slot==='m'?'fm':'fb']:1 });
    toast('Foto salva ✓');
  }catch(e){ toast('Erro ao salvar a foto'); console.error(e); }
  refreshCard(id); if(detailId===id) renderDetail(id);
}
async function apagarFotoSlot(id,slot){
  await fDel(`${id}:${slot}`).catch(()=>{}); await fDel(`${id}:${slot}:t`).catch(()=>{});
  dropUrl(`${id}:${slot}`); dropUrl(`${id}:${slot}:t`);
  setSt(id,{ [slot==='m'?'fm':'fb']:0, [slot==='m'?'wm':'wb']:'' });
  refreshCard(id); if(detailId===id) renderDetail(id);
}

/* ============ Wiki (Fandom) — roda no navegador do usuário ============ */
const WIKI='https://hotwheels.fandom.com/api.php';
let wikiAutoOff=false;
function tituloWiki(it){
  for(const c of ['pagina','fonte']){
    const u=F(it,c);
    if(u && /fandom\.com\/wiki\//.test(u)){
      try{ return decodeURIComponent(String(u).split('/wiki/')[1].split('?')[0]).replace(/_/g,' '); }catch(e){}
    }
  }
  return null;
}
function urlWikiPagina(it){
  for(const c of ['pagina','fonte']){ const u=F(it,c); if(u && /fandom\.com\/wiki\//.test(u)) return u; }
  return null;
}
/* Capas por casting: busca em lote DUAS imagens de cada página —
   a miniatura solta e a do blister/cartela — guardadas como {m,b}. */
const coverWait={}; let coverT=null;
function pedirCover(title,img,pref){
  if(wikiAutoOff||!navigator.onLine) return;
  if(title in ST.covers){ aplicarCover(title,[{img,pref:pref||'b'}]); return; }
  (coverWait[title] ||= []).push({img,pref:pref||'b'});
  clearTimeout(coverT); coverT=setTimeout(buscarCovers,400);
}
/* Escolhe, entre os arquivos da página, a melhor foto de cartela e a melhor solta */
function classificarFotos(imgs){
  let cart=null, cartN=0, solta=null, soltaN=0;
  for(const im of imgs||[]){
    const nome=im.title||'';
    if(/\.svg$/i.test(nome)) continue;
    const l=nrm(nome);
    /* descarta o que claramente não é o carro */
    if(/logo|wheel type|rodas|base\b|interior|tampo detail|comparison|collage|scale drawing/.test(l)) continue;
    let c=0;
    if(/carded/.test(l)) c=3;
    else if(/\bcard\b|blister|cartela|package|packaging/.test(l)) c=2;
    if(c){ if(c>cartN){ cartN=c; cart=nome; } continue; }
    let s=1;
    if(/loose/.test(l)) s=3;
    else if(/prototype|mock|render/.test(l)) s=0;
    if(s>soltaN){ soltaN=s; solta=nome; }
  }
  return {cart,solta};
}
async function buscarCovers(){
  if(wikiAutoOff){ for(const t in coverWait) delete coverWait[t]; return; }
  const titles=Object.keys(coverWait).filter(t=>!(t in ST.covers)).slice(0,12);
  if(!titles.length) return;
  try{
    const u=`${WIKI}?action=query&format=json&origin=*&redirects=1&prop=pageimages%7Cimages&piprop=thumbnail&pithumbsize=400&imlimit=500&titles=${encodeURIComponent(titles.join('|'))}`;
    const j=await (await fetch(u)).json();
    const alias={}; for(const n of (j.query?.normalized||[])) alias[n.from]=n.to;
    for(const r of (j.query?.redirects||[])){ for(const k in alias) if(alias[k]===r.from) alias[k]=r.to; alias[r.from]=r.to; }
    const principal={}, escolha={};
    for(const p of Object.values(j.query?.pages||{})){
      principal[p.title]=p.thumbnail?.source||0;
      escolha[p.title]=classificarFotos(p.images);
    }
    /* resolve as URLs dos dois arquivos escolhidos de cada página */
    const files=[...new Set(Object.values(escolha).flatMap(e=>[e.cart,e.solta]).filter(Boolean))];
    const fileUrl={};
    for(let i=0;i<files.length;i+=40){
      const u2=`${WIKI}?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=400&titles=${encodeURIComponent(files.slice(i,i+40).join('|'))}`;
      const j2=await (await fetch(u2)).json();
      for(const p of Object.values(j2.query?.pages||{})){
        const ii=p.imageinfo?.[0]; if(ii) fileUrl[p.title]=ii.thumburl||ii.url;
      }
    }
    for(const t of titles){
      const fin=alias[t]||t, e=escolha[fin]||{};
      ST.covers[t]={ b:fileUrl[e.cart]||0, m:fileUrl[e.solta]||principal[fin]||0 };
    }
    save();
    for(const t of titles) aplicarCover(t);
  }catch(e){ wikiAutoOff=true; }
  if(Object.keys(coverWait).some(t=>!(t in ST.covers))) setTimeout(buscarCovers,300);
}
function urlCover(title,pref){
  const c=ST.covers[title];
  if(!c) return 0;
  if(typeof c==='string') return pref==='mini'?0:c;   /* cache de versão antiga */
  /* 'mini' = o recorte da solta no card: só quando existem as duas e são diferentes */
  if(pref==='mini') return (c.m&&c.b&&c.m!==c.b) ? c.m : 0;
  return (pref==='m' ? (c.m||c.b) : (c.b||c.m))||0;
}
function aplicarCover(title,lista){
  const alvos=lista||coverWait[title]||[];
  if(!lista) delete coverWait[title];
  for(const {img,pref} of alvos){
    const src=urlCover(title,pref);
    if(!src||!img||!img.isConnected||img.classList.contains('ok')) continue;
    img.src=src; img.onload=()=>img.classList.add('ok');
  }
}
/* Foto da versão exata: casa o Toy #/cor do item com a linha da tabela na wiki */
const fotoVersaoCache={};
async function fotoDaVersao(it){
  const t=tituloWiki(it); if(!t||wikiAutoOff||!navigator.onLine) return null;
  const chave=it.id;
  if(chave in fotoVersaoCache) return fotoVersaoCache[chave];
  try{
    const linhas=linhasVersoes(await paginaWiki(t));
    const toy=nrm(String(F(it,'toy')||'').trim()), cor=nrm(String(F(it,'cor')||'').trim());
    let melhor=null, nivel=0;
    for(const r of linhas){
      if(!r.img) continue;
      let n=0;
      if(toy.length>=4&&nrm(r.toy||'').includes(toy)) n=3;
      else if(cor.length>=3&&nrm(r.cor||'')===cor) n=2;
      else if(cor.length>=3&&nrm(r.cor||'').includes(cor)) n=1;
      if(n>nivel){ nivel=n; melhor=r.img; }
    }
    return fotoVersaoCache[chave]=melhor;
  }catch(e){ return fotoVersaoCache[chave]=null; }
}
function wikiFull(src){ return src.replace(/\/scale-to-width-down\/\d+/,''); }
function wikiThumb(src,w){ const base=wikiFull(src); const m=base.match(/^(.*?\/revision\/latest)(\?.*)?$/); return m? `${m[1]}/scale-to-width-down/${w}${m[2]||''}` : base; }
function imgDaWiki(el){
  if(!el) return '';
  const s=el.getAttribute('data-src')||el.getAttribute('src')||'';
  if(!/static\.wikia/.test(s)||/\.svg/i.test(s)) return '';
  return wikiFull(s.split('/scale-to-width-down')[0].replace(/\/smart\/.*$/,''));
}

/* ============ Coleções vindas da wiki ============
   Alguns recortes que o usuário quer acompanhar não existem na planilha
   (que cobre só BMW/Porsche/Ferrari). Para esses, a lista de versões é lida
   da Hot Wheels Wiki no navegador e vira item normal: dá para marcar,
   fotografar, buscar e entra no backup. */
function urlWiki(t){ return 'https://hotwheels.fandom.com/wiki/'+encodeURIComponent(String(t).replace(/ /g,'_')); }
const wikiCache={};
async function paginaWiki(titulo){
  if(wikiCache[titulo]) return wikiCache[titulo];
  const u=`${WIKI}?action=parse&format=json&origin=*&redirects=1&prop=text&page=${encodeURIComponent(titulo)}`;
  const j=await (await fetch(u)).json();
  const html=j.parse?.text?.['*'];
  if(!html) throw new Error(j.error?.info||'sem conteúdo');
  return wikiCache[titulo]=html;
}
/* Lê as tabelas de versões de uma página de casting/série */
function linhasVersoes(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const linhas=[];
  for(const tab of doc.querySelectorAll('table')){
    const trs=[...tab.querySelectorAll('tr')]; if(trs.length<2) continue;
    const head=[...trs[0].children].map(td=>nrm(td.textContent||''));
    const idx=(...nomes)=>head.findIndex(h=>nomes.some(n=>h.includes(n)));
    const iAno=idx('year','ano'), iToy=idx('toy'), iSerie=idx('series','serie'), iCor=idx('color'),
          iCol=idx('col #','col#','collection'), iTampo=idx('tampo'), iRodas=idx('wheel'),
          iPais=idx('country'), iNotas=idx('note'), iModelo=idx('casting','model');
    if(iAno<0&&iToy<0) continue; /* não é uma tabela de versões */
    for(const tr of trs.slice(1)){
      const tds=[...tr.children]; if(tds.length<2) continue;
      const cel=i=>(i>=0&&tds[i])?String(tds[i].textContent||'').trim().replace(/\s+/g,' '):'';
      const ano=parseInt(cel(iAno),10);
      const r={ano:isNaN(ano)?null:ano, toy:cel(iToy), serie:cel(iSerie), cor:cel(iCor),
               col:cel(iCol), tampo:cel(iTampo), rodas:cel(iRodas), pais:cel(iPais),
               notas:cel(iNotas), modelo:cel(iModelo), img:imgDaWiki(tr.querySelector('img'))};
      if(!r.ano&&!r.toy&&!r.serie&&!r.cor) continue;
      linhas.push(r);
    }
  }
  return linhas;
}
/* Transforma uma linha da wiki em item igual aos da planilha */
function itemWiki(pref,casting,titulo,r,i,usados,extraHay){
  const nome=r.modelo||casting;
  const v=new Array(DATA.cols.length).fill(null);
  const set=(c,val)=>{ if(val!=null&&val!=='') v[CI[c]]=val; };
  set('ano',r.ano); set('casting',nome); set('modelo',nome);
  set('serie',r.serie); set('ncol',r.col); set('toy',r.toy); set('cor',r.cor);
  set('tampo',r.tampo); set('rodas',r.rodas); set('pais',r.pais); set('notas',r.notas);
  set('pagina',urlWiki(titulo));
  /* id estável por casting+ano+toy+cor para as marcações sobreviverem a recarregamentos */
  const base=`${pref}:${nrm(nome)}:${r.ano||'?'}:${r.toy||'?'}:${nrm(r.cor||'?')}`;
  let id=base, n=2; while(usados.has(id)) id=`${base}#${n++}`;
  usados.add(id);
  const it={id, mk:pref==='kk'?'kool':'toonedw', ord:i, v, img:r.img||''};
  it.hay=nrm(['casting','serie','ncol','toy','cor','tampo','rodas','notas','pais','ano']
    .map(c=>F(it,c)??'').join(' ')+' '+(extraHay||''));
  return it;
}
/* Busca em blocos, registrando os itens para o detalhe funcionar.
   A mesma versão pode aparecer na página do casting e na página da série:
   repetida entre páginas diferentes ela é ignorada; repetida dentro da mesma
   página (ex.: variação por país) vira um item próprio. */
async function itensDePaginas(titulos,pref,extraHay,aoAvancar){
  const usados=new Set(), donoDaChave=new Map(), itens=[];
  for(let i=0;i<titulos.length;i+=5){
    const bloco=await Promise.all(titulos.slice(i,i+5).map(async t=>{
      try{ return [t,linhasVersoes(await paginaWiki(t))]; }catch(e){ return [t,[]]; }
    }));
    for(const [t,linhas] of bloco) for(const r of linhas){
      const nome=r.modelo||t;
      const chave=`${nrm(nome)}:${r.ano||'?'}:${r.toy||'?'}:${nrm(r.cor||'?')}`;
      const dono=donoDaChave.get(chave);
      if(dono&&dono!==t) continue;              /* já veio de outra página */
      donoDaChave.set(chave,t);
      itens.push(itemWiki(pref,t,t,r,itens.length,usados,extraHay));
    }
    if(aoAvancar) aoAvancar(Math.min(i+5,titulos.length),titulos.length,itens);
  }
  for(const it of itens) BYID[it.id]=it;
  return itens;
}

/* ============================================================
   Base Hot Wheels Tooned (catálogo curado — fonte de verdade)
   ------------------------------------------------------------
   TOON é só leitura: nunca é sobrescrito pelo que o usuário marca.
   A coleção do usuário fica em TU (chave hwt.user.v1), ligada pelo
   variant.id, então dá para trocar o seed por uma versão nova sem
   perder nada do que já foi marcado.
   ============================================================ */
const TOON = __HW_TOONED_JSON__;
const TCAST = TOON.castings, TVAR = TOON.variants;
const TC = {};                                   /* casting_id -> casting + variações */
for(const c of TCAST) TC[c.casting_id]={...c, vars:[], prod:[]};
const TV = {};                                   /* variant.id -> variação */
const KIND={dedicated_tooned_casting:'Casting Tooned dedicado',
            official_tooned_style_member:'Membro oficial do estilo Tooned',
            official_segment_member:'Membro oficial do segmento Tooned',
            legacy_related_casting:'Casting relacionado (legacy)'};
const ESPECIAL={treasure_hunt:'Treasure Hunt', super_treasure_hunt:'Super Treasure Hunt',
  zamac:'ZAMAC', retailer_exclusive:'Exclusivo de loja', special_event:'Evento especial',
  convention_auction:'Leilão de convenção', limited:'Edição limitada', licensed:'Licenciado',
  premium:'Premium', anniversary:'Aniversário', silver_series:'Silver Series',
  color_shifters:'Color Shifters', special_release:'Lançamento especial', prototype:'Protótipo'};
/* entra no progresso padrão só o que é checklist principal e já saiu */
const tPrim = v => v.primary_checklist===true && v.status==='released';
for(const v of TVAR){
  TV[v.id]=v;
  const c=TC[v.casting_id]; if(!c) continue;
  (v.variation_type==='production_variant' ? c.prod : c.vars).push(v);
  v.busca=nrm([v.id,c.canonical_name,v.year,v.series,v.line,v.collector_number,v.toy_number,
    v.color_deco,v.wheels,v.country,v.variation_label,ESPECIAL[v.special]||v.special,
    v.special==='super_treasure_hunt'?'sth':'', v.special==='treasure_hunt'?'th':'',
    (v.notes||[]).join(' ')].filter(x=>x!=null&&x!=='').join(' '));
}
const ordemVar=(a,b)=>(a.year||0)-(b.year||0)||String(a.variation_label||'').localeCompare(String(b.variation_label||''))||a.id.localeCompare(b.id);
for(const id in TC){ TC[id].vars.sort(ordemVar); TC[id].prod.sort(ordemVar);
  TC[id].busca=nrm([TC[id].canonical_name,TC[id].debut_year,KIND[TC[id].tooned_kind],TC[id].generation].join(' ')); }
/* pendentes ficam presos ao casting, sem botão de posse */
const TPEND={};
for(const p of TOON.pendentes||[]) (TPEND[p.casting_id] ||= []).push(p);

/* ---- Coleção do usuário (separada do seed) ---- */
const TU_KEY='hwt.user.v1';
let TU={v:{}};
try{ const raw=localStorage.getItem(TU_KEY); if(raw) TU=Object.assign(TU,JSON.parse(raw)||{}); }catch(e){}
if(!TU.v||typeof TU.v!=='object') TU.v={};
let tuT=null;
function tuSave(){ clearTimeout(tuT); tuT=setTimeout(()=>{
  try{ localStorage.setItem(TU_KEY,JSON.stringify(TU)); }catch(e){ toast('Não consegui salvar (armazenamento cheio?)'); } },250); }
const tuOf = id => TU.v[id]||{};
function tuSet(id,patch){
  const cur=Object.assign({},TU.v[id]||{},patch);
  for(const k of Object.keys(cur)){
    const val=cur[k];
    if(val===null||val===undefined||val===''||val===false) delete cur[k];
    else if(k==='quantity'&&(!(val>1))) delete cur[k];   /* 1 é o padrão de quem tem */
  }
  if(Object.keys(cur).length) TU.v[id]=cur; else delete TU.v[id];
  tuSave();
}
const tTenho = id => !!tuOf(id).owned;
function tStats(vars){
  const base=vars.filter(tPrim);
  const tenho=base.filter(v=>tTenho(v.id)).length;
  return {total:base.length, tenho, pct: base.length ? 100*tenho/base.length : 0};
}
/* marcações órfãs = seed novo removeu/renomeou ids; nunca apagadas sozinhas */
const tOrfaos = () => Object.keys(TU.v).filter(id=>!TV[id]);

/* ---- Filtros da aba Tooned ---- */
const TFILTROS=[
  ['dedicados','Somente castings Tooned', v=>TC[v.casting_id]?.tooned_kind==='dedicated_tooned_casting'],
  ['oficiais','Membros oficiais da série', v=>['official_tooned_style_member','official_segment_member'].includes(TC[v.casting_id]?.tooned_kind)],
  ['legacy','Legacy 2003–2016', v=>v.year&&v.year<=2016],
  ['modern','Modern 2017+', v=>v.year&&v.year>=2017],
  ['th','Treasure Hunt', v=>v.special==='treasure_hunt'],
  ['sth','Super Treasure Hunt', v=>v.special==='super_treasure_hunt'],
  ['zamac','ZAMAC', v=>v.special==='zamac'],
  ['excl','Exclusivos', v=>['retailer_exclusive','special_event','convention_auction'].includes(v.special)],
  ['p5','5-Packs', v=>nrm(v.series||'').includes('5-pack')],
  ['gulf','Gulf', v=>nrm((v.series||'')+' '+(v.color_deco||'')).includes('gulf')],
  ['a56','56th Anniversary', v=>nrm(v.series||'').includes('56th')],
  ['tenho','Tenho', v=>tTenho(v.id)],
  ['naotenho','Não tenho', v=>!tTenho(v.id)],
  ['fav','Favoritos', v=>!!tuOf(v.id).favorite],
  ['prod','Variações de produção', v=>v.variation_type==='production_variant'],
  ['proto','Protótipos / não lançados', v=>!tPrim(v)],   /* desligado por padrão */
];
const TF_MAPA=Object.fromEntries(TFILTROS.map(f=>[f[0],f[2]]));
/* protótipos e os itens 2014–2015 só entram quando o filtro é ligado à mão */
function tVariantes(){
  const on=[...V.tf];
  const q=nrm(V.q.trim()).split(/\s+/).filter(Boolean);
  return TVAR.filter(v=>{
    if(!on.includes('proto')&&!tPrim(v)) return false;
    for(const k of on){ const f=TF_MAPA[k]; if(f&&!f(v)) return false; }
    if(q.length&&!q.every(t=>v.busca.includes(t))) return false;
    return true;
  });
}
function tCastingsVisiveis(){
  const vis=new Set(tVariantes().map(v=>v.casting_id));

}

function filtrar(){
  const toks=nrm(V.q.trim()).split(/\s+/).filter(Boolean);
  let out=escopoItens().filter(it=>{
    if(V.st!=='' && String(own(it.id))!==V.st) return false;

    if(V.tipo && kf(it,'tipo')!==V.tipo) return false;
    if(V.rar && kf(it,'rar')!==V.rar) return false;
    if(V.pri && kf(it,'pri')!==V.pri) return false;
    if(V.escopo && kf(it,'escopo')!==V.escopo) return false;
    if(V.sit && kf(it,'sit')!==V.sit) return false;
    if(V.foto){ const s=stOf(it.id); const tem=!!(s.fm||s.fb); if(V.foto==='com'&&!tem) return false; if(V.foto==='sem'&&tem) return false; }
    if(toks.length && !toks.every(t=>it.hay.includes(t))) return false;
    return true;
  });
  const ano=it=>F(it,'ano')??-1;
  if(V.sort==='anoDesc') out.sort((a,b)=>ano(b)-ano(a)||a.ord-b.ord);
  else if(V.sort==='anoAsc') out.sort((a,b)=>ano(a)-ano(b)||a.ord-b.ord);
  else if(V.sort==='casting') out.sort((a,b)=>String(F(a,'casting')).localeCompare(String(F(b,'casting')),'pt')||a.ord-b.ord);

}

async function hidratarThumb(card,it){
  const img=card.querySelector('.thumb img'); if(!img) return;
  const mini=card.querySelector('.thumb .mini');
  const s=stOf(it.id);
  /* as duas fotos: a do blister é a principal, a da solta vira o recorte */
  let blister=null, solta=null;
  if(s.fb) blister=await fotoUrl(`${it.id}:b:t`);
  if(!blister&&s.wb) blister=wikiThumb(s.wb,240);
  if(s.fm) solta=await fotoUrl(`${it.id}:m:t`);
  if(!solta&&s.wm) solta=wikiThumb(s.wm,240);
  if(!solta&&it.img) solta=wikiThumb(it.img,240);
  const t=tituloWiki(it);
  if(t){
    if(t in ST.covers){
      if(!blister) blister=urlCover(t,'b')||null;
      if(!solta) solta=urlCover(t,'m')||null;
    }else{
      if(!blister) pedirCover(t,img,'b');
      if(!solta&&mini) pedirCover(t,mini,'mini');
    }
  }
  const principal=blister||solta;
  if(principal){ img.src=principal; img.onload=()=>img.classList.add('ok'); img.onerror=()=>img.classList.remove('ok'); }
  if(mini&&blister&&solta&&blister!==solta){ mini.src=solta; mini.onload=()=>mini.classList.add('ok'); }
}

  if(V.tab==='painel'||V.tab==='castings'||V.tab==='tooned') return;
  const lista=$('#lista'); if(!lista) return;
  const fim=Math.min(listPos+60,listItems.length);
  if(listPos>=fim) return;
  const tmp=document.createElement('div');
  tmp.innerHTML=listItems.slice(listPos,fim).map(cardHTML).join('');
  const novos=[...tmp.children];
  const frag=document.createDocumentFragment(); novos.forEach(n=>frag.appendChild(n));
  lista.appendChild(frag);
  novos.forEach(n=>hidratarThumb(n,BYID[n.dataset.id]));
  listPos=fim;

}

/* ============ Painel ============ */
function statsDe(items){
  let t=0,c=0; for(const it of items){ const o=own(it.id); if(o===2)t++; else if(o===1)c++; }
  return {total:items.length,tenho:t,caminho:c,faltam:items.length-t-c};
}
function meterHTML(s){
  const p1=s.total?100*s.tenho/s.total:0, p2=s.total?100*s.caminho/s.total:0;
  return `<div class="meter" role="img" aria-label="${s.tenho} tenho, ${s.caminho} a caminho, ${s.faltam} faltam">
    ${p1>0?`<i class="m1" style="width:${p1}%"></i>`:''}${p2>0?`<i class="m2" style="width:${p2}%"></i>`:''}</div>`;
}

function slotHTML(it,slot,rotulo,ph){

    <div class="acts">
      <button data-foto="${slot}">📷 ${temFoto?'Trocar foto':'Minha foto'}</button>
      <button data-wiki="${slot}">🌐 Wiki</button>
      ${(temFoto||wiki)?`<button data-del="${slot}">🗑</button>`:''}
    </div>
  </div>`;
}
async function hidratarSlot(root,it,slot){
  const s=stOf(it.id);
  const box=root.querySelector(`.slot[data-slot="${slot}"]`); if(!box) return;
  const img=box.querySelector('img'), tag=box.querySelector('.tag');
  const temFoto=slot==='m'?s.fm:s.fb, wiki=slot==='m'?s.wm:s.wb;
  let src=null, origem='';
  if(temFoto){ src=await fotoUrl(`${it.id}:${slot}`); origem='minha foto'; }
  if(!src&&wiki){ src=wikiThumb(wiki,700); origem='wiki'; }
  if(!src&&slot==='m'&&it.img){ src=wikiThumb(it.img,700); origem='wiki (lista)'; }
  const t=tituloWiki(it);
  if(!src&&t){
    if(t in ST.covers){ const c=urlCover(t,slot); if(c){ src=c; origem='wiki (casting)'; } }
    else pedirCover(t,img,slot);
  }
  if(src){ img.src=src; img.onload=()=>{img.classList.add('ok')}; tag.textContent=origem; tag.style.display='block'; }
  /* a foto da versão exata (mesmo Toy #) substitui a capa genérica da solta */
  if(slot==='m'&&!temFoto&&!wiki&&!it.img&&t){
    fotoDaVersao(it).then(u=>{
      if(!u||!img.isConnected) return;
      img.src=wikiThumb(u,700); img.onload=()=>img.classList.add('ok');
      tag.textContent='wiki (esta versão)'; tag.style.display='block';
    });
  }
}

/* ============ Wiki picker ============ */
async function abrirWiki(it,slotPreferido){
  const t=tituloWiki(it);
  $('#wTitle').textContent=`Wiki: ${F(it,'casting')||''}`;
  $('#wGrid').innerHTML='';
  abrir('mWiki');
  if(!t){
    $('#wStatus').innerHTML='Este item não tem página conhecida na Hot Wheels Wiki. Use 📷 para tirar sua própria foto.';
    return;
  }
  $('#wStatus').textContent='Buscando imagens na Hot Wheels Wiki…';
  let html='';
  try{
    const u=`${WIKI}?action=parse&format=json&origin=*&redirects=1&prop=text&page=${encodeURIComponent(t)}`;
    const j=await (await fetch(u)).json();
    html=j.parse?.text?.['*']||'';
    if(!html) throw new Error(j.error?.info||'sem conteúdo');
  }catch(e){
    const pg=urlWikiPagina(it);
    $('#wStatus').innerHTML=`Não consegui acessar a wiki agora (você está online?). ${pg?`<a href="${esc(pg)}" target="_blank" rel="noopener">Abrir a página no navegador ↗</a>`:''}`;
    return;
  }
  const doc=new DOMParser().parseFromString(html,'text/html');
  const toy=nrm(String(F(it,'toy')||'').trim());
  const cor=nrm(String(F(it,'cor')||'').trim());
  const vistos=new Set(); const cands=[];
  for(const tr of doc.querySelectorAll('table tr')){
    const imgs=tr.querySelectorAll('img'); if(!imgs.length) continue;
    const txt=nrm(tr.textContent||'');
    let nivel=0;
    if(toy&&toy.length>=4&&txt.includes(toy)) nivel=2;
    else if(cor&&cor.length>=3&&txt.includes(cor)) nivel=1;
    for(const im of imgs){
      let src=im.getAttribute('data-src')||im.getAttribute('src')||'';
      if(!/static\.wikia/.test(src)||/\.svg/i.test(src)) continue;
      const full=wikiFull(src.split('/scale-to-width-down')[0].replace(/\/smart\/.*$/,''));
      if(vistos.has(full)) continue; vistos.add(full);
      const cells=[...tr.children].map(td=>td.textContent.trim()).filter(x=>x&&x.length<60);
      cands.push({src:full,cap:cells.slice(0,6).join(' · ').slice(0,140),nivel});
    }
  }
  for(const im of doc.querySelectorAll('img')){
    let src=im.getAttribute('data-src')||im.getAttribute('src')||'';
    if(!/static\.wikia/.test(src)||/\.svg/i.test(src)) continue;
    const full=wikiFull(src.split('/scale-to-width-down')[0].replace(/\/smart\/.*$/,''));
    if(vistos.has(full)) continue; vistos.add(full);
    cands.push({src:full,cap:im.getAttribute('alt')||'',nivel:0});
  }
  cands.sort((a,b)=>b.nivel-a.nivel);
  if(!cands.length){
    const pg=urlWikiPagina(it);
    $('#wStatus').innerHTML=`A página não tem imagens que eu consiga ler. ${pg?`<a href="${esc(pg)}" target="_blank" rel="noopener">Abrir na wiki ↗</a>`:''}`;
    return;
  }
  const nMatch=cands.filter(c=>c.nivel===2).length;
  $('#wStatus').innerHTML=`${fmt(cands.length)} imagens encontradas${nMatch?` — <b style="color:var(--good-txt)">${nMatch} na linha com o mesmo Toy # (${esc(F(it,'toy'))})</b>`:''}. Toque em <b>Miniatura</b> ou <b>Blister</b> para usar a imagem no card.`;
  $('#wGrid').innerHTML=cands.slice(0,80).map((c,i)=>`
    <figure class="wk-item ${c.nivel===2?'match':''}" style="margin:0">
      ${c.nivel===2?'<div class="m-tag">✓ Toy # confere</div>':(c.nivel===1?'<div class="m-tag" style="color:var(--acc)">≈ cor parecida</div>':'')}
      <div class="wi" data-wz="${i}"><img loading="lazy" src="${esc(wikiThumb(c.src,300))}" alt=""></div>
      <figcaption>${esc(c.cap)}</figcaption>
      <div class="acts"><button data-usar="m" data-i="${i}">Miniatura</button><button data-usar="b" data-i="${i}">Blister</button></div>
    </figure>`).join('');
  $('#wGrid').dataset.itemId=it.id;
  window._wkCands=cands;
}

/* ============ Backup ============ */
function baixar(nome,blob){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
}
const b64=blob=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.readAsDataURL(blob); });
async function exportarBackup(){
  toast('Montando backup…');
  const fotos=[];
  try{
    const keys=await fKeys();
    for(const k of keys){
      if(String(k).endsWith(':t')) continue; /* miniaturas são regeradas na importação */
      const blob=await fGet(k);
      if(blob) fotos.push({k,tipo:blob.type||'image/jpeg',b64:await b64(blob)});
    }
  }catch(e){}
  const payload={app:'hwc',v:2,quando:new Date().toISOString(),estado:ST,tooned:TU,fotos};
  baixar(`hotwheels-backup-${new Date().toISOString().slice(0,10)}.json`,
    new Blob([JSON.stringify(payload)],{type:'application/json'}));
  toast(`Backup gerado: ${fmt(Object.keys(ST.it).length)} itens marcados, ${fmt(fotos.length)} fotos`);
}
async function importarBackup(file){
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=='hwc') throw new Error('formato');
    Object.assign(ST.it,j.estado?.it||{});
    if(j.tooned?.v){ Object.assign(TU.v,j.tooned.v); tuSave(); }   /* coleção Tooned */
    /* capas de backups antigos guardavam uma foto só — ignora e deixa rebuscar as duas */
    if(j.estado?.coversV===3) Object.assign(ST.covers,j.estado?.covers||{});
    save();
    let n=0;
    for(const f of (j.fotos||[])){
      const bin=atob(f.b64); const arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      const blob=new Blob([arr],{type:f.tipo||'image/jpeg'});
      await fPut(f.k,blob);
      const th=await redimensionar(blob,360,.8).catch(()=>null);
      if(th) await fPut(`${f.k}:t`,th);
      dropUrl(f.k); dropUrl(`${f.k}:t`); n++;
    }
    toast(`Backup importado ✓ (${fmt(n)} fotos)`);
    render();
  }catch(e){ toast('Arquivo de backup inválido'); console.error(e); }
}

/* ============ Modais / eventos ============ */
function abrir(id){ $('#'+id).classList.add('open'); document.body.style.overflow='hidden'; }
function fechar(id){ $('#'+id).classList.remove('open');
  if(!document.querySelector('.modal.open')) document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const m=[...document.querySelectorAll('.modal.open')].pop(); if(m) fechar(m.id); } });
let toastT=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

document.addEventListener('click',e=>{
  const el=e.target;
  const closeBtn=el.closest('[data-close]'); if(closeBtn){ fechar(closeBtn.dataset.close); return; }
  if(el.closest('#mZoom')){ fechar('mZoom'); return; }
  const modal=el.classList&&el.classList.contains('modal')?el:null; if(modal){ fechar(modal.id); return; }

  const tab=el.closest('[data-tab]');
  if(tab){ setTab(tab.dataset.tab); return; }
  if(el.closest('#btnHelp')){ renderHelp(); return; }
  /* --- aba Tooned --- */
  const tview=el.closest('[data-tview]'); if(tview){ V.tview=tview.dataset.tview; renderTooned(); return; }
  const tf=el.closest('[data-tf]');
  if(tf){
    const k=tf.dataset.tf;
    if(k==='__todos') V.tf.clear();
    else if(V.tf.has(k)) V.tf.delete(k);
    else{
      V.tf.add(k);
      /* pares que se anulam: manter os dois ligados nunca devolve nada */
      const opostos={tenho:'naotenho',naotenho:'tenho',legacy:'modern',modern:'legacy',dedicados:'oficiais',oficiais:'dedicados'};
      if(opostos[k]) V.tf.delete(opostos[k]);
    }
    renderTooned(); return;
  }
  const town=el.closest('[data-town]');
  if(town){
    const id=town.dataset.town;
    tuSet(id,{owned:!tTenho(id)});
    toast(tTenho(id)?'Adicionado à coleção ✓':'Removido da coleção');
    tRefresh(); if($('#mVar').classList.contains('open')&&tVarAtual===id) renderVariante(id);
    return;
  }
  const tcast=el.closest('[data-tcast]'); if(tcast){ renderCasting(tcast.dataset.tcast); return; }
  const tvar=el.closest('[data-tvar]'); if(tvar){ renderVariante(tvar.dataset.tvar); return; }
  const tset=el.closest('[data-tset]');
  if(tset&&tVarAtual){
    const [campo,valor]=tset.dataset.tset.split(':');
    tuSet(tVarAtual,{[campo]: valor==='1'});
    renderVariante(tVarAtual); tRefresh(); return;
  }

  const chip=el.closest('[data-st]'); if(chip){ V.st=chip.dataset.st; render(); return; }
  if(el.closest('#btnKoolRetry')){ koolEstado='vazio'; render(); return; }
  if(el.closest('#btnFiltros')){ V.fOpen=!V.fOpen; $('#fpanel').classList.toggle('open',V.fOpen); $('#btnFiltros').classList.toggle('on',V.fOpen||!$('#fbN').classList.contains('hide')); return; }
  if(el.closest('#btnLimpar')){ limparFiltros(); $('#q').value=''; V.q=''; render(); return; }

  const goto=el.closest('[data-goto]'); if(goto){ limparFiltros(); V.tab=goto.dataset.goto; render(); window.scrollTo({top:0}); return; }
  const atalho=el.closest('[data-atalho]');
  if(atalho){
    limparFiltros(); $('#q').value=''; V.q=''; V.tab='todos';
    const a=atalho.dataset.atalho;
    if(a==='p1'){ V.pri='1 — Comprar agora'; V.st='0'; }
    if(a==='caminho'){ V.st='1'; }
    if(a==='novidades'){ V.sit='2026 — listado; confirmar disponibilidade'; }
    if(a==='fotos'){ V.foto='com'; }
    render(); window.scrollTo({top:0}); return;
  }
  const cast=el.closest('[data-casting]');
  if(cast){ limparFiltros(); V.tab='todos'; V.q=cast.dataset.casting; $('#q').value=V.q; render(); window.scrollTo({top:0}); return; }

  if(el.closest('#btnExport')){ exportarBackup(); return; }
  if(el.closest('#btnImport')){ $('#inpImport').click(); return; }
  if(el.closest('#btnPrint')){ window.print(); return; }

  /* dentro de um card */
  const ownBtn=el.closest('[data-own]');
  if(ownBtn){
    const card=ownBtn.closest('[data-id]');
    const id=card?card.dataset.id:detailId;
    if(id){ const novo=+ownBtn.dataset.own;
      setSt(id,{o:novo});
      refreshCard(id);
      if(detailId===id&&$('#mDetail').classList.contains('open')) renderDetail(id);
      const nomes=['marcado como Falta','marcado como A caminho','adicionado à coleção ✓'];
      toast(`${F(BYID[id],'casting')} ${nomes[novo]}`);
    }
    return;
  }
  const card=el.closest('.card[data-id]');
  if(card&&!el.closest('.ownseg')){ listItems.length||(listItems=filtrar()); renderDetail(card.dataset.id); return; }

  /* detalhe: fotos */
  const fotoBtn=el.closest('[data-foto]');
  if(fotoBtn&&detailId){ const inp=$('#inpFoto'); inp.dataset.id=detailId; inp.dataset.slot=fotoBtn.dataset.foto; inp.value=''; inp.click(); return; }
  const wikiBtn=el.closest('[data-wiki]');
  if(wikiBtn&&detailId){ abrirWiki(BYID[detailId],wikiBtn.dataset.wiki); return; }
  const delBtn=el.closest('[data-del]');
  if(delBtn&&detailId){ if(confirm('Remover a foto deste espaço?')) apagarFotoSlot(detailId,delBtn.dataset.del); return; }
  const zoomEl=el.closest('[data-zoom]');
  if(zoomEl&&detailId){
    const img=zoomEl.querySelector('img');
    if(img&&img.classList.contains('ok')){ $('#mZoom img').src=img.src; abrir('mZoom'); }
    return;
  }

  /* wiki picker */
  const usar=el.closest('[data-usar]');
  if(usar){
    const c=window._wkCands?.[+usar.dataset.i]; const id=$('#wGrid').dataset.itemId;
    if(c&&id){
      setSt(id,{ [usar.dataset.usar==='m'?'wm':'wb']:c.src });
      toast(usar.dataset.usar==='m'?'Imagem definida para a miniatura ✓':'Imagem definida para o blister ✓');
      fechar('mWiki'); refreshCard(id); if(detailId===id) renderDetail(id);
    }
    return;
  }
  const wz=el.closest('[data-wz]');
  if(wz){ const c=window._wkCands?.[+wz.dataset.wz]; if(c){ $('#mZoom img').src=wikiThumb(c.src,1000); abrir('mZoom'); } return; }
});

$('#inpFoto').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  salvarFoto(e.target.dataset.id,e.target.dataset.slot,f);
});
$('#inpImport').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) importarBackup(f); e.target.value=''; });

/* botão voltar ao topo — a lista pode ter milhares de itens */
addEventListener('scroll',()=>{ $('#btnTop').classList.toggle('show',scrollY>700&&!document.querySelector('.modal.open')); },{passive:true});
$('#btnTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

let qT=null;
$('#q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ V.q=e.target.value; if(V.tab==='painel') V.tab='todos'; render(); },250); });
for(const [selId,key] of [['#fAno','ano'],['#fTipo','tipo'],['#fRar','rar'],['#fPri','pri'],['#fEscopo','escopo'],['#fSit','sit'],['#fFoto','foto'],['#fSort','sort']]){
  $(selId).addEventListener('change',e=>{ V[key]=e.target.value; render(); });
}

render();
</script>
