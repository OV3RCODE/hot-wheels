<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262e"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd400"/>
      <stop offset=".45" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#e2211c"/>
    </linearGradient>
    <linearGradient id="fire2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
  </defs>
<rect width="512" height="512" fill="url(#bg)"/>
<g transform="translate(256 256) scale(.84) translate(-256 -256)">
  

  <!-- chamas atrás da roda -->
  <g transform="rotate(-4 256 210)">
    <path fill="url(#fire)" d="M336 132
      C 268 118, 210 128, 178 148
      C 138 130, 96 136, 52 122
      C 92 158, 96 170, 76 186
      C 112 184, 128 192, 118 214
      C 152 202, 168 210, 164 234
      C 196 220, 224 226, 232 250
      C 262 274, 322 284, 352 268 Z"/>
    <path fill="url(#fire2)" d="M330 168
      C 280 158, 236 164, 210 180
      C 182 170, 152 174, 122 166
      C 148 188, 150 196, 138 208
      C 164 206, 176 212, 170 228
      C 196 220, 212 226, 212 244
      C 240 258, 300 264, 330 252 Z"/>
  </g>

  <!-- roda estilo redline -->
  <g transform="translate(346 200)">
    <circle r="96" fill="#0a0a0c"/>
    <circle r="96" fill="none" stroke="#3a3a42" stroke-width="6"/>
    <circle r="66" fill="none" stroke="#e2211c" stroke-width="10"/>
    <circle r="50" fill="#c8c8ce"/>
    <circle r="50" fill="none" stroke="#8b8b93" stroke-width="4"/>
    <g stroke="#55555e" stroke-width="9" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="40"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="-28" y1="-28" x2="28" y2="28"/>
      <line x1="-28" y1="28" x2="28" y2="-28"/>
    </g>
    <circle r="16" fill="#2b2b31"/>
  </g>

  <!-- tarja branca com o apelido -->
  <g transform="rotate(-4 256 352)">
    <rect x="2" y="314" width="508" height="76" rx="12" fill="#ffffff"/>
    <rect x="2" y="314" width="508" height="76" rx="12" fill="none" stroke="#e2211c" stroke-width="6"/>
    <text x="256" y="372" font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-style="italic" font-size="58" fill="#0a0a0c" text-anchor="middle" letter-spacing="4">K1LL3R</text>
  </g>
  <!-- nome do app -->
  <text x="256" y="446" font-family="'Arial Black','Arial',sans-serif" font-weight="900" font-style="italic" font-size="40" fill="#ffd400" text-anchor="middle" letter-spacing="1">COLEÇÃO PESSOAL</text>
</g>
